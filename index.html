<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>光寶會員登入</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --liteon-turquoise: #00a1b0;
      --liteon-turquoise-dark: #007f8a;
      --text-dark: #1f2933;
      --text-light: #f8fafc;
      --border-light: rgba(0, 161, 176, 0.2);
      --bg-gray: #f1f5f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(0, 161, 176, 0.15), rgba(0, 161, 176, 0.5)), var(--bg-gray);
      font-family: 'Noto Sans TC', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dark);
    }

    .login-card {
      width: min(480px, 92vw);
      background: #ffffff;
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 24px 50px rgba(15, 31, 45, 0.12);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: -120px 60% auto -120px;
      height: 260px;
      background: radial-gradient(circle at top, rgba(0, 161, 176, 0.28), transparent 60%);
      z-index: 0;
      transform: rotate(-12deg);
    }

    .login-header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--liteon-turquoise), var(--liteon-turquoise-dark));
      display: grid;
      place-items: center;
      color: var(--text-light);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 12px 24px rgba(0, 161, 176, 0.3);
    }

    .login-header h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .login-header p {
      margin: 4px 0 0;
      color: #52606d;
      font-size: 0.95rem;
    }

    form {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 22px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border-light);
      border-radius: 14px;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--liteon-turquoise);
      box-shadow: 0 0 0 4px rgba(0, 161, 176, 0.12);
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.9rem;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #3e4c59;
    }

    .remember input {
      accent-color: var(--liteon-turquoise);
    }

    .link {
      color: var(--liteon-turquoise);
      text-decoration: none;
      font-weight: 500;
    }

    .link:hover {
      text-decoration: underline;
    }

    button[type="submit"] {
      margin-top: 10px;
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, var(--liteon-turquoise), var(--liteon-turquoise-dark));
      color: var(--text-light);
      box-shadow: 0 14px 28px rgba(0, 161, 176, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 32px rgba(0, 161, 176, 0.32);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #9aa5b1;
      margin: 6px 0 -4px;
      font-size: 0.85rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(154, 165, 177, 0.4);
    }

    .social-login {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .social-login button {
      flex: 1 1 45%;
      min-width: 120px;
      border: 1px solid rgba(0, 161, 176, 0.4);
      background: #ffffff;
      color: var(--liteon-turquoise-dark);
      border-radius: 14px;
      padding: 10px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .social-login button:hover {
      background: rgba(0, 161, 176, 0.08);
      box-shadow: 0 12px 20px rgba(0, 161, 176, 0.18);
    }

    .footer-text {
      margin-top: 22px;
      text-align: center;
      color: #7b8794;
      font-size: 0.9rem;
    }

    @media (max-width: 520px) {
      .login-card {
        padding: 40px 28px;
      }

      .login-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .login-header h1 {
        font-size: 1.6rem;
      }

      .logo {
        width: 48px;
        height: 48px;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-card" role="main">
    <div class="login-header">
      <div class="logo" aria-hidden="true">L</div>
      <div>
        <h1>光寶會員登入</h1>
        <p>歡迎回到光寶科技會員中心，請輸入帳號密碼進行登入。</p>
      </div>
    </div>
    <form>
      <div class="input-group">
        <label for="email">會員帳號 / Email</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>
      <div class="input-group">
        <label for="password">登入密碼</label>
        <input type="password" id="password" name="password" placeholder="請輸入密碼" required>
      </div>
      <div class="form-actions">
        <label class="remember">
          <input type="checkbox" name="remember">
          記住我
        </label>
        <a class="link" href="#">忘記密碼？</a>
      </div>
      <button type="submit">登入會員</button>
      <div class="divider">或以其他方式登入</div>
      <div class="social-login" aria-label="第三方登入選項">
        <button type="button">使用企業單一登入</button>
        <button type="button">以 Google 登入</button>
      </div>
      <p class="footer-text">尚未加入光寶會員？<a class="link" href="#">立即註冊</a></p>
    </form>
  </div>
</body>
</html>
